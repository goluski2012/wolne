<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wolne Tory Poznań</title>
    <!-- Tailwind CSS do pięknego niebieskiego wyglądu -->
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-b from-blue-50 to-blue-100 min-h-screen font-sans text-slate-800">

    <div class="max-w-md mx-auto px-4 py-8">
        <!-- Nagłówek -->
        <header class="text-center mb-8">
            <div class="inline-block p-3 bg-blue-600 text-white rounded-full shadow-lg mb-3">
                <svg xmlns="http://w3.org" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9" />
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-blue-900">Wolne Tory</h1>
            <p class="text-sm text-blue-600 font-medium">Poznań i okolice</p>
        </header>

        <!-- Wyszukiwarka -->
        <div class="bg-white p-5 rounded-2xl shadow-md border border-blue-100 mb-6">
            <label class="block text-xs font-bold uppercase tracking-wider text-blue-700 mb-2">Szukaj wolnego toru</label>
            <div class="relative">
                <input type="text" id="searchInput" 
                       placeholder="np. gdzie o 14:00 jest wolny tor" 
                       value="gdzie o 14:00 jest wolny tor"
                       class="w-full pl-4 pr-10 py-3 bg-blue-50/50 border border-blue-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium text-slate-700 text-sm placeholder-slate-400 transition">
                <button id="searchBtn" class="absolute right-2 top-2 p-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition">
                    <svg xmlns="http://w3.org" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </button>
            </div>
            <p class="text-[11px] text-slate-400 mt-2">Wpisz zapytanie ze specyficzną godziną (np. 14:00, 08:30)</p>
        </div>

        <!-- Sekcja wyników wyszukiwania -->
        <div id="resultsSection" class="hidden mb-6">
            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-3" id="resultsTitle">Wyniki wyszukiwania</h3>
            <div id="resultsContainer" class="space-y-3"></div>
        </div>

        <!-- Przegląd wszystkich basenów -->
        <div>
            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-3">Wszystkie baseny</h3>
            <div id="poolsContainer" class="space-y-4">
                <!-- Ładowanie danych... -->
                <div class="text-center py-6 text-sm text-slate-400">Ładowanie grafików basenowych...</div>
            </div>
        </div>
    </div>

    <!-- Logika aplikacji w JavaScript -->
    <script>
        let dbData = null;

        // Dni tygodnia po polsku
        const daysMap = { 0: 'niedziela', 1: 'poniedziałek', 2: 'wtorek', 3: 'środa', 4: 'czwartek', 5: 'piątek', 6: 'sobota' };
        const currentDayName = daysMap[new Date().getDay()];

        // Pobieranie bazy z wygenerowanego JSONa
        fetch('schedule.json')
            .then(res => res.json())
            .then(data => {
                dbData = data;
                renderAllPools();
                executeSearch(); // Wykonaj domyślne wyszukiwanie na start
            })
            .catch(err => {
                document.getElementById('poolsContainer').innerHTML = `
                    <div class="p-4 bg-red-50 text-red-700 text-xs rounded-xl border border-red-100">
                        Nie udało się załadować danych. Upewnij się, że plik schedule.json istnieje.
                    </div>
                `;
            });

        function renderAllPools() {
            if (!dbData || !dbData.pools) return;
            const container = document.getElementById('poolsContainer');
            container.innerHTML = '';

            Object.keys(dbData.pools).forEach(poolName => {
                const card = document.createElement('div');
                card.className = "bg-white p-5 rounded-2xl shadow-sm border border-slate-100 hover:border-blue-200 transition";
                
                card.innerHTML = `
                    <div class="flex justify-between items-center mb-2">
                        <h4 class="font-bold text-slate-800 text-base">${poolName}</h4>
                        <span class="px-2 py-0.5 bg-blue-50 text-blue-700 text-[11px] font-semibold rounded-full uppercase tracking-wider">
                            ${currentDayName}
                        </span>
                    </div>
                    <div class="text-xs text-slate-500">Kliknij wyszukiwarkę powyżej, aby znaleźć wolne godziny.</div>
                `;
                container.appendChild(card);
            });
        }

        function executeSearch() {
            const query = document.getElementById('searchInput').value;
            const timeMatch = query.match(/(\d{1,2}):(\d{2})/);
            
            if (!timeMatch) {
                alert("Proszę podać godzinę w formacie HH:MM (np. 14:00)");
                return;
            }

            let inputHour = timeMatch[1].padStart(2, '0');
            let inputMinute = timeMatch[2];
            const targetTime = `${inputHour}:${inputMinute}`;

            const resultsContainer = document.getElementById('resultsContainer');
            const resultsSection = document.getElementById('resultsSection');
            const resultsTitle = document.getElementById('resultsTitle');

            resultsContainer.innerHTML = '';
            resultsTitle.innerText = `Wyniki wyszukiwania dla godziny ${targetTime} (${currentDayName})`;
            resultsSection.classList.remove('hidden');

            let foundAny = false;

            if (dbData && dbData.pools) {
                Object.keys(dbData.pools).forEach(poolName => {
                    const poolDayData = dbData.pools[poolName][currentDayName] || [];
                    
                    // Szukamy pasującego slotu godzinowego
                    const matchingSlot = poolDayData.find(slot => {
                        return targetTime >= slot.time_start && targetTime <= slot.time_end;
                    });

                    if (matchingSlot && matchingSlot.is_available) {
                        foundAny = true;
                        const item = document.createElement('div');
                        item.className = "flex items-center justify-between p-4 bg-gradient-to-r from-blue-600 to-sky-600 text-white rounded-xl shadow-sm";
                        item.innerHTML = `
                            <div>
                                <div class="font-bold text-sm">${poolName}</div>
                                <div class="text-[11px] opacity-90">Slot: ${matchingSlot.time_start} - ${matchingSlot.time_end}</div>
                            </div>
                            <div class="text-right">
                                <div class="text-lg font-black">${matchingSlot.available_lanes_count}</div>
                                <div class="text-[9px] uppercase tracking-wider font-semibold opacity-75">wolne tory</div>
                            </div>
                        `;
                        resultsContainer.appendChild(item);
                    }
                });
            }

            if (!foundAny) {
                resultsContainer.innerHTML = `
                    <div class="p-4 bg-slate-100 text-slate-600 text-xs rounded-xl text-center">
                        Brak wolnych torów na wszystkich basenach o godzinie ${targetTime}.
                    </div>
                `;
            }
        }

        document.getElementById('searchBtn').addEventListener('click', executeSearch);
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') executeSearch();
        });
    </script>
</body>
</html>
