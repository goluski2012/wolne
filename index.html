<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wolne Tory Poznań</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #eff6ff; color: #1e293b; margin: 0; padding: 20px; }
        .container { max-width: 450px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: #1e3a8a; margin: 0; font-size: 28px; }
        .header p { color: #2563eb; margin: 5px 0 0 0; font-size: 14px; font-weight: bold; }
        .search-box { background: white; padding: 20px; rounded-radius: 16px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid #dbeafe; margin-bottom: 20px; }
        .search-box label { font-size: 11px; font-weight: bold; color: #1d4ed8; text-transform: uppercase; display: block; margin-bottom: 8px; }
        .search-flex { display: flex; gap: 10px; }
        .search-input { flex-grow: 1; padding: 12px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 14px; }
        .search-btn { background: #2563eb; color: white; border: none; padding: 0 20px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .search-btn:hover { background: #1d4ed8; }
        .result-card { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: linear-gradient(135deg, #2563eb, #0284c7); color: white; border-radius: 12px; margin-bottom: 10px; box-shadow: 0 4px 6px -1px rgba(37,99,235,0.2); }
        .result-pool { font-weight: bold; font-size: 15px; }
        .result-time { font-size: 11px; opacity: 0.9; margin-top: 2px; }
        .result-count { font-size: 24px; font-weight: 900; text-align: right; }
        .result-label { font-size: 9px; text-transform: uppercase; opacity: 0.8; }
        .pool-card { background: white; padding: 20px; border-radius: 16px; border: 1px solid #f1f5f9; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .pool-name { font-weight: bold; color: #334155; }
        .badge { background: #dbeafe; color: #1d4ed8; padding: 4px 8px; border-radius: 9999px; font-size: 10px; font-weight: bold; text-transform: uppercase; }
        .error-msg { padding: 15px; background: #fef2f2; color: #991b1b; border-radius: 12px; border: 1px solid #fee2e2; font-size: 13px; text-align: center; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Wolne Tory</h1>
            <p>Poznań i okolice</p>
        </div>

        <div class="search-box">
            <label>Szukaj wolnego toru</label>
            <div class="search-flex">
                <input type="text" id="searchInput" placeholder="np. gdzie o 14:00" value="gdzie o 14:00 jest wolny tor">
                <button id="searchBtn" class="search-btn">Szukaj</button>
            </div>
        </div>

        <div id="resultsSection" class="hidden" style="margin-bottom: 25px;">
            <h3 style="font-size: 12px; color: #64748b; text-transform: uppercase; margin-bottom: 10px;" id="resultsTitle">Wyniki wyszukiwania</h3>
            <div id="resultsContainer"></div>
        </div>

        <div>
            <h3 style="font-size: 12px; color: #64748b; text-transform: uppercase; margin-bottom: 10px;">Status basenów</h3>
            <div id="poolsContainer">
                <div style="text-align: center; color: #94a3b8; font-size: 14px; padding: 20px;">Ładowanie grafików...</div>
            </div>
        </div>
    </div>

    <script>
        let dbData = null;
        const daysMap = { 0: 'niedziela', 1: 'poniedziałek', 2: 'wtorek', 3: 'środa', 4: 'czwartek', 5: 'piątek', 6: 'sobota' };
        const currentDayName = daysMap[new Date().getDay()];

        fetch('./schedule.json')
            .then(res => {
                if(!res.ok) throw new Error();
                return res.json();
            })
            .then(data => {
                dbData = data;
                renderPools();
                executeSearch();
            })
            .catch(() => {
                document.getElementById('poolsContainer').innerHTML = `<div class="error-msg">Baza danych ładuje się na serwerze. Odśwież stronę za moment.</div>`;
            });

        function renderPools() {
            if (!dbData || !dbData.pools) return;
            const container = document.getElementById('poolsContainer');
            container.innerHTML = '';
            Object.keys(dbData.pools).forEach(name => {
                const div = document.createElement('div');
                div.className = 'pool-card';
                div.innerHTML = `<span class="pool-name">${name}</span><span class="badge">${currentDayName}</span>`;
                container.appendChild(div);
            });
        }

        function executeSearch() {
            const query = document.getElementById('searchInput').value;
            const timeMatch = query.match(/(\d{1,2}):(\d{2})/);
            if (!timeMatch) return;
            
            const targetTime = timeMatch[0];
            const container = document.getElementById('resultsContainer');
            container.innerHTML = '';
            document.getElementById('resultsTitle').innerText = `Wyniki wyszukiwania o godz. ${targetTime} (${currentDayName})`;
            document.getElementById('resultsSection').classList.remove('hidden');

            if (dbData && dbData.pools) {
                Object.keys(dbData.pools).forEach(name => {
                    const slots = dbData.pools[name][currentDayName] || [];
                    const found = slots.find(s => targetTime >= s.time_start && targetTime <= s.time_end);
                    if (found && found.is_available) {
                        const item = document.createElement('div');
                        item.className = 'result-card';
                        item.innerHTML = `<div><div class="result-pool">${name}</div><div class="result-time">Slot: ${found.time_start}-${found.time_end}</div></div><div><div class="result-count">${found.available_lanes_count}</div><div class="result-label">wolne tory</div></div>`;
                        container.appendChild(item);
                    }
                });
            }
        }

        document.getElementById('searchBtn').addEventListener('click', executeSearch);
    </script>
</body>
</html>
