<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wolne Tory Poznań</title>
    <!-- Nowy link do stylów Tailwind CSS -->
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-blue-50 min-h-screen font-sans text-gray-800">

    <div class="max-w-md mx-auto px-4 py-8">
        <!-- Nagłówek -->
        <header class="text-center mb-8">
            <div class="inline-block p-4 bg-blue-600 text-white rounded-full shadow-lg mb-3">
                <svg xmlns="http://w3.org" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9" />
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-blue-950">Wolne Tory</h1>
            <p class="text-sm text-blue-600 font-semibold">Poznań i okolice</p>
        </header>

        <!-- Wyszukiwarka -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-blue-100 mb-6">
            <label class="block text-xs font-bold uppercase tracking-wider text-blue-700 mb-2">Szukaj wolnego toru</label>
            <div class="flex gap-2">
                <input type="text" id="searchInput" 
                       placeholder="np. gdzie o 14:00 jest wolny tor" 
                       value="gdzie o 14:00 jest wolny tor"
                       class="w-full px-4 py-3 bg-blue-50 border border-blue-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium text-gray-700 text-sm">
                <button id="searchBtn" class="px-4 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold transition shadow-sm">
                    Szukaj
                </button>
            </div>
            <p class="text-[11px] text-gray-400 mt-2">Wpisz zapytanie ze specyficzną godziną (np. 14:00, 08:30)</p>
        </div>

        <!-- Sekcja wyników wyszukiwania -->
        <div id="resultsSection" class="hidden mb-6">
            <h3 class="text-xs font-bold uppercase tracking-wider text-gray-500 mb-3" id="resultsTitle">Wyniki wyszukiwania</h3>
            <div id="resultsContainer" class="space-y-3"></div>
        </div>

        <!-- Przegląd wszystkich basenów -->
        <div>
            <h3 class="text-xs font-bold uppercase tracking-wider text-gray-500 mb-3">Wszystkie baseny</h3>
            <div id="poolsContainer" class="space-y-4">
                <div class="text-center py-6 text-sm text-gray-400">Ładowanie grafików basenowych...</div>
            </div>
        </div>
    </div>

    <script>
        let dbData = null;
        const daysMap = { 0: 'niedziela', 1: 'poniedziałek', 2: 'wtorek', 3: 'środa', 4: 'czwartek', 5: 'piątek', 6: 'sobota' };
        
        // Zabezpieczenie: dynamiczne pobieranie aktualnego dnia tygodnia w strefie czasowej użytkownika
        const currentDayName = daysMap[new Date().getDay()];

        // Pobieranie bazy z relatywnym punktem odniesienia ./
        fetch('./schedule.json')
            .then(res => {
                if (!res.ok) throw new Error("Błąd ładowania pliku");
                return res.json();
            })
            .then(data => {
                dbData = data;
                renderAllPools();
                executeSearch();
            })
            .catch(err => {
                document.getElementById('poolsContainer').innerHTML = `
                    <div class="p-4 bg-red-50 text-red-700 text-xs rounded-xl border border-red-100">
                        Nie udało się załadować danych. Upewnij się, że plik schedule.json wygenerował się poprawnie w zakładce Actions.
                    </div>
                `;
            });

        function renderAllPools() {
            if (!dbData || !dbData.pools) return;
            const container = document.getElementById('poolsContainer');
            container.innerHTML = '';

            Object.keys(dbData.pools).forEach(poolName => {
                const card = document.createElement('div');
                card.className = "bg-white p-5 rounded-2xl shadow-sm border border-gray-100";
                card.innerHTML = `
                    <div class="flex justify-between items-center mb-1">
                        <h4 class="font-bold text-gray-800 text-base">${poolName}</h4>
                        <span class="px-2 py-0.5 bg-blue-100 text-blue-700 text-[10px] font-bold rounded-full uppercase">
                            ${currentDayName}
                        </span>
                    </div>
                    <div class="text-xs text-gray-400">Dane załadowane pomyślnie. Wykorzystaj wyszukiwarkę.</div>
                `;
                container.appendChild(card);
            });
        }

        function executeSearch() {
            const query = document.getElementById('searchInput').value;
            const timeMatch = query.match(/(\d{1,2}):(\d{2})/);
            
            if (!timeMatch) {
                alert("Proszę podać godzinę w formacie HH:MM (np. 14:00)");
                return;
            }

            const targetTime = timeMatch[0].padStart(5, '0');
            const resultsContainer = document.getElementById('resultsContainer');
            const resultsSection = document.getElementById('resultsSection');
            const resultsTitle = document.getElementById('resultsTitle');

            resultsContainer.innerHTML = '';
            resultsTitle.innerText = `Wyniki wyszukiwania dla godziny ${targetTime} (${currentDayName})`;
            resultsSection.classList.remove('hidden');

            let foundAny = false;

            if (dbData && dbData.pools) {
                Object.keys(dbData.pools).forEach(poolName => {
                    const poolDayData = dbData.pools[poolName][currentDayName] || [];
                    
                    const matchingSlot = poolDayData.find(slot => {
                        return targetTime >= slot.time_start && targetTime <= slot.time_end;
                    });

                    if (matchingSlot && matchingSlot.is_available) {
                        foundAny = true;
                        const item = document.createElement('div');
                        item.className = "flex items-center justify-between p-4 bg-blue-600 text-white rounded-xl shadow-sm shadow-blue-200";
                        item.innerHTML = `
                            <div>
                                <div class="font-bold text-sm">${poolName}</div>
                                <div class="text-[11px] opacity-80">Godziny: ${matchingSlot.time_start} - ${matchingSlot.time_end}</div>
                            </div>
                            <div class="text-right">
                                <div class="text-lg font-black">${matchingSlot.available_lanes_count}</div>
                                <div class="text-[9px] uppercase tracking-wider font-semibold opacity-75">wolne tory</div>
                            </div>
                        `;
                        resultsContainer.appendChild(item);
                    }
                });
            }

            if (!foundAny) {
                resultsContainer.innerHTML = `
                    <div class="p-4 bg-gray-100 text-gray-600 text-xs rounded-xl text-center">
                        Brak wolnych torów na basenach o godzinie ${targetTime}.
                    </div>
                `;
            }
        }

        document.getElementById('searchBtn').addEventListener('click', executeSearch);
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') executeSearch();
        });
    </script>
</body>
</html>
